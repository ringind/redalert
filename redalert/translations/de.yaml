configuration:
  bridge_host:
    name: Hue-Bridge-IP
    description: >-
      IP-Adresse der Hue Bridge. Optional – kann auch pro /pair-Aufruf übergeben werden.
  area_id:
    name: Entertainment-Bereich-ID
    description: >-
      ID des Hue-Entertainment-Bereichs, an den gestreamt wird. Über den Button
      „Bereiche laden“ im Web-UI oder GET /areas ermitteln.
  channel_order:
    name: Kanalreihenfolge
    description: >-
      Optionale explizite Liste von channel_ids, die die Reihenfolge des
      Kometen-Sweeps bestimmt. Leer lassen = native Reihenfolge des Bereichs.
  effect:
    name: Effekt
    description: >-
      pulse = alle Lampen zusammen: von 0 auf 100 % im Takt der Musik, zwischen
      den Pulsen wieder auf 0 (Abfallen schneller als Aufblenden).
      chase = ein Komet läuft gleichmäßig umlaufend über die Kanäle und zieht
      einen Schweif hinter sich her.
  color:
    name: Farbe
    description: Hex-Farbe des Lauflichts (Standard #FF0000, Star-Trek-Rot).
  fps:
    name: Frames pro Sekunde
    description: Taktrate des DTLS-Streams. Höher = flüssiger, mehr Netzlast (5–50).
  sweep_seconds:
    name: Sweep-Dauer
    description: >-
      chase: Sekunden für eine volle Umrundung aller Lampen.
      pulse ohne Cue: Dauer eines vollständigen Auf-/Ab-Zyklus (0.3–5.0).
  attack_ms:
    name: Attack (ms)
    description: >-
      pulse – wie langsam das Licht von 0 auf 100 % aufblendet.
  release_ms:
    name: Release (ms)
    description: >-
      pulse – wie schnell das Licht zwischen den Pulsen auf 0 abfällt.
      Für den typischen Look kleiner als Attack wählen (schnelleres Abfallen).
  restore_state:
    name: Lichtzustand wiederherstellen
    description: >-
      Vor dem Effekt den aktuellen Zustand der Lampen (an/aus, Helligkeit, Farbe)
      sichern und danach wiederherstellen.
  cue_file:
    name: Pfad zur Cue-Datei
    description: >-
      Pfad zu einer alternativen redalert_cue.json (z. B. /share/redalert_cue.json).
      Leer = mitgelieferte Cue verwenden.
  log_level:
    name: Log-Level
    description: Ausführlichkeit des Add-on-Protokolls (trace, debug, info, notice, warning, error, fatal).
network:
  8099/tcp: REST-API und Web-UI (nur nötig für Zugriff außerhalb von Ingress, z. B. rest_command)
