configuration:
  bridges:
    name: Hue Bridges
    description: >-
      Bis zu 3 Hue Bridges, die gleichzeitig abspielen. Pro Bridge Zeile
      hinzufügen; effect/color/sweep_seconds/chase_pause/attack_ms/release_ms/
      glow_low/glow_high/glitter_interval_ms/glitter_flash_ms/glitter_colors/
      gc_direction/gc_strip_lengths/gc_count/gc_length/gc_speed/
      gc_background_color/gc_chase_glitter/gc_background_pulse/
      color2/lightning_interval_ms/lightning_flash_ms/meteor_count/
      meteor_speed/firework_interval_ms/firework_speed/ripple_interval_ms/
      ripple_speed/wave_length/flicker_interval_ms/flicker_dip_ms sind je
      Bridge optional – leer gelassen gilt der gleichnamige Wert weiter unten
      als Standard für diese Bridge.
    bridge_host:
      name: Hue-Bridge-IP
      description: >-
        IP-Adresse der Hue Bridge. Kann auch pro /pair-Aufruf übergeben werden.
    area_id:
      name: Entertainment-Bereich-ID
      description: >-
        ID des Hue-Entertainment-Bereichs dieser Bridge, an den gestreamt wird.
        Über den Button „Bereiche laden“ im Web-UI oder GET /areas ermitteln.
    channel_order:
      name: Kanalreihenfolge
      description: >-
        Optionale Reihenfolge der channel_ids dieser Bridge für den
        Kometen-Sweep, als kommagetrennte Liste, z. B. 2,3,1,0,5,4. Leer
        lassen = native Reihenfolge des Bereichs.
    effect:
      name: Effekt (diese Bridge)
      description: >-
        Überschreibt die Options effect für diese eine Bridge. Leer = Standard
        weiter unten. neutral = diese Bridge wird nicht gesteuert (kein Stream,
        kein Sichern/Wiederherstellen) – nützlich, um in einem Effektset eine
        Bridge auszulassen.
    color:
      name: Farbe (diese Bridge)
      description: >-
        Überschreibt die Option color für diese eine Bridge. Leer = Standard
        weiter unten.
    sweep_seconds:
      name: Sweep-Dauer (diese Bridge)
      description: >-
        Überschreibt die Option sweep_seconds für diese eine Bridge. Leer =
        Standard weiter unten.
    chase_pause:
      name: chase-Pause (diese Bridge)
      description: >-
        Überschreibt die Option chase_pause für diese eine Bridge. Leer =
        Standard weiter unten.
    attack_ms:
      name: Attack ms (diese Bridge)
      description: >-
        Überschreibt die Option attack_ms für diese eine Bridge. Leer =
        Standard weiter unten.
    release_ms:
      name: Release ms (diese Bridge)
      description: >-
        Überschreibt die Option release_ms für diese eine Bridge. Leer =
        Standard weiter unten.
    glow_low:
      name: Grund-Glühwert (diese Bridge)
      description: >-
        Überschreibt die Option glow_low für diese eine Bridge. Leer =
        Standard weiter unten.
    glow_high:
      name: Spitzen-Wert (diese Bridge)
      description: >-
        Überschreibt die Option glow_high für diese eine Bridge. Leer =
        Standard weiter unten.
    glitter_interval_ms:
      name: Glitter-Intervall ms (diese Bridge)
      description: >-
        Überschreibt die Option glitter_interval_ms für diese eine Bridge.
        Leer = Standard weiter unten.
    glitter_flash_ms:
      name: Glitter-Blitzdauer ms (diese Bridge)
      description: >-
        Überschreibt die Option glitter_flash_ms für diese eine Bridge. Leer =
        Standard weiter unten.
    glitter_colors:
      name: Glitter-Farben (diese Bridge)
      description: >-
        Überschreibt die Option glitter_colors für diese eine Bridge
        (Hex-Farben, durch Leerzeichen getrennt). Leer = Standard weiter unten.
    gc_direction:
      name: chase – Richtung(en) (diese Bridge)
      description: >-
        Überschreibt die Option gc_direction für diese eine Bridge. Ein Wert
        (forward/backward/bounce) gilt für alle Strips dieser Bridge; mit
        gc_strip_lengths in mehrere Strips aufgeteilt, kann hier auch eine
        kommagetrennte Liste stehen (eine Richtung je Strip, z. B.
        "forward,backward"). Leer = Standard weiter unten.
    gc_strip_lengths:
      name: chase – Strip-Längen (diese Bridge)
      description: >-
        Nur effect chase. Teilt die Kanäle dieser Bridge (nach
        channel_order) in aufeinanderfolgende Gradient-Lightstrips auf, als
        kommagetrennte Segmentzahlen, z. B. "7,5" für zwei kombinierte Strips
        zu 7 bzw. 5 Segmenten. Summe muss der Kanalzahl entsprechen, sonst
        gilt ein einzelner Strip über alle Kanäle. Leer = ein einzelner Strip.
    gc_count:
      name: chase – Anzahl Chases (diese Bridge)
      description: >-
        Überschreibt die Option gc_count für diese eine Bridge. Leer =
        Standard weiter unten.
    gc_length:
      name: chase – Chase-Länge (diese Bridge)
      description: >-
        Überschreibt die Option gc_length für diese eine Bridge. Leer =
        Standard weiter unten.
    gc_speed:
      name: chase – Geschwindigkeit (diese Bridge)
      description: >-
        Überschreibt die Option gc_speed für diese eine Bridge. Leer =
        Standard weiter unten.
    gc_background_color:
      name: chase – Background-Farbe (diese Bridge)
      description: >-
        Überschreibt die Option gc_background_color für diese eine Bridge.
        Leer = Standard weiter unten.
    gc_chase_glitter:
      name: chase – Chases funkeln (diese Bridge)
      description: >-
        Überschreibt die Option gc_chase_glitter für diese eine Bridge. Leer =
        Standard weiter unten.
    gc_background_pulse:
      name: chase – Background pulsiert (diese Bridge)
      description: >-
        Überschreibt die Option gc_background_pulse für diese eine Bridge.
        Leer = Standard weiter unten.
    color2:
      name: zweite Farbe (diese Bridge)
      description: >-
        Überschreibt die Option color2 für diese eine Bridge – zweite
        Farbe für police (Gruppe 2) und duel (zweiter Komet). Leer =
        Standard weiter unten.
    lightning_interval_ms:
      name: lightning – Blitz-Intervall ms (diese Bridge)
      description: >-
        Überschreibt die Option lightning_interval_ms für diese eine Bridge.
        Leer = Standard weiter unten.
    lightning_flash_ms:
      name: lightning – Blitzdauer ms (diese Bridge)
      description: >-
        Überschreibt die Option lightning_flash_ms für diese eine Bridge.
        Leer = Standard weiter unten.
    meteor_count:
      name: meteor – Anzahl (diese Bridge)
      description: >-
        Überschreibt die Option meteor_count für diese eine Bridge. Leer =
        Standard weiter unten.
    meteor_speed:
      name: meteor – Geschwindigkeit (diese Bridge)
      description: >-
        Überschreibt die Option meteor_speed für diese eine Bridge. Leer =
        Standard weiter unten.
    firework_interval_ms:
      name: firework – Intervall ms (diese Bridge)
      description: >-
        Überschreibt die Option firework_interval_ms für diese eine Bridge.
        Leer = Standard weiter unten.
    firework_speed:
      name: firework – Geschwindigkeit (diese Bridge)
      description: >-
        Überschreibt die Option firework_speed für diese eine Bridge. Leer =
        Standard weiter unten.
    ripple_interval_ms:
      name: ripple – Intervall ms (diese Bridge)
      description: >-
        Überschreibt die Option ripple_interval_ms für diese eine Bridge.
        Leer = Standard weiter unten.
    ripple_speed:
      name: ripple – Geschwindigkeit (diese Bridge)
      description: >-
        Überschreibt die Option ripple_speed für diese eine Bridge. Leer =
        Standard weiter unten.
    wave_length:
      name: wave – Wellenlänge (diese Bridge)
      description: >-
        Überschreibt die Option wave_length für diese eine Bridge. Leer =
        Standard weiter unten.
    flicker_interval_ms:
      name: flicker – Intervall ms (diese Bridge)
      description: >-
        Überschreibt die Option flicker_interval_ms für diese eine Bridge.
        Leer = Standard weiter unten.
    flicker_dip_ms:
      name: flicker – Einbruchsdauer ms (diese Bridge)
      description: >-
        Überschreibt die Option flicker_dip_ms für diese eine Bridge. Leer =
        Standard weiter unten.
  effect:
    name: Effekt (Standard)
    description: >-
      Standard-Effekt für Bridges ohne eigene Einstellung. pulse = alle Lampen
      zusammen: von 0 auf 100 % im Takt, zwischen den Pulsen wieder auf 0
      (Abfallen schneller als Aufblenden). comet = ein Komet läuft gleichmäßig
      umlaufend über die Kanäle und zieht einen Schweif hinter sich her.
      glitter = jede Lampe funkelt für sich in sehr kurzen Abständen in
      wechselnden Farben auf (Diamant-Gefunkel). police = zwei Lampengruppen
      blinken abwechselnd in zwei Farben (Alarmlicht). lightning = alle
      Lampen blitzen gemeinsam in zufälligen Abständen auf, manchmal ein
      Doppelblitz (Gewitter). heartbeat = ein Doppelpuls (lub-dub) wie ein
      Herzschlag. aurora = langsame, weiche Farbwellen wandern über die
      Lampen (Polarlicht). rainbow = ein durchgehender, phasenversetzter
      Regenbogen-Farbumlauf über die Lampen. meteor = mehrere unabhängige
      Meteore mit zufälliger Geschwindigkeit und Helligkeit. wipe = ein
      Auffüll-Balken läuft einmal über die Kanäle, hält kurz voll und beginnt
      von vorn. firework = wiederkehrende Feuerwerk-Ausbrüche von der Mitte
      aus. ripple = ein Helligkeitsimpuls läuft von der Mitte aus, prallt an
      beiden Enden ab und läuft als Echo zurück, bevor er verblasst und von
      vorn beginnt. wave = eine durchgehende, wandernde Sinuswelle über die
      Kanäle, mehrere Wellenberge gleichzeitig sichtbar. flicker = Lampen
      brechen sporadisch kurz ein, wie eine defekte Glühbirne. strobe = ein
      hartes, sofortiges Blitzen ohne Überblendung, im Party-Stroboskop-Stil.
      duel = zwei Kometen starten an entgegengesetzten Enden, treffen sich in
      der Mitte und prallen zurück. chase = nur für Gradient Lightstrips: ein
      oder mehrere weich
      überblendete Zwei-Farben-Bänder laufen über die Segmente, siehe die
      gc_*-Optionen. neutral = die Lampen werden nicht gesteuert (z. B. für
      ein Effektset, in dem nur einzelne Bridges laufen).
  color:
    name: Farbe (Standard)
    description: >-
      Standard-Hex-Farbe für Bridges ohne eigene Einstellung (Vorgabe
      #FF0000, Star-Trek-Rot).
  fps:
    name: Frames pro Sekunde
    description: >-
      Taktrate des DTLS-Streams (für alle Bridges gleich). Höher = flüssiger,
      mehr Netzlast (5–50).
  sweep_seconds:
    name: Sweep-Dauer (Standard)
    description: >-
      Standard für Bridges ohne eigene Einstellung. comet: Sekunden für eine
      volle Umrundung aller Lampen. pulse/heartbeat: Dauer eines Zyklus.
      wave/strobe/duel: Periodendauer. Wertebereich 0.3–300 – für sehr
      langsame, ruhige Effekte deutlich höher als für die schnellen Effekte
      wählen.
  chase_pause:
    name: chase-Pause in Sekunden (Standard)
    description: >-
      Standard für Bridges ohne eigene Einstellung. Pause zwischen zwei
      comet-Durchläufen. 0 = durchgehend umlaufender Komet (Standard). > 0 =
      ein kompletter Durchlauf, dann alle Lampen für so viele Sekunden auf dem
      Grund-Glühwert, dann der nächste Durchlauf.
  attack_ms:
    name: Attack ms (Standard)
    description: >-
      Standard für Bridges ohne eigene Einstellung. pulse – wie langsam das
      Licht von glow_low auf glow_high aufblendet.
  release_ms:
    name: Release ms (Standard)
    description: >-
      Standard für Bridges ohne eigene Einstellung. pulse – wie schnell das
      Licht zwischen den Pulsen auf glow_low abfällt. Für den typischen Look
      kleiner als Attack wählen (schnelleres Abfallen).
  glow_low:
    name: Grund-Glühwert (Standard)
    description: >-
      Standard für Bridges ohne eigene Einstellung. Helligkeit (0–1), auf die
      die Lampen zwischen den Pulsen zurückgehen – bei beiden Effekten. 0 =
      ganz aus, z. B. 0.08 = schwaches Dauerglühen.
  glow_high:
    name: Spitzen-Wert (Standard)
    description: >-
      Standard für Bridges ohne eigene Einstellung. Helligkeit (0–1) im
      Puls-Maximum (beide Effekte). Standard 1.0 = volle Helligkeit. Muss über
      dem Grund-Glühwert liegen.
  glitter_interval_ms:
    name: Glitter-Intervall (ms, Standard)
    description: >-
      Nur effect glitter. Mittlerer Abstand in Millisekunden zwischen zwei
      Funkel-Blitzen über alle Lampen einer Bridge. Klein = hektisches
      Diamant-Gefunkel (Standard 90).
  glitter_flash_ms:
    name: Glitter-Blitzdauer (ms, Standard)
    description: >-
      Nur effect glitter. Wie schnell ein einzelner Funken wieder abklingt
      (Zeitkonstante in Millisekunden). Größer als das Intervall = mehrere
      Lampen funkeln gleichzeitig (Standard 260).
  glitter_colors:
    name: Glitter-Farben (Standard)
    description: >-
      Nur effect glitter. Liste von Hex-Farben (durch Leerzeichen getrennt,
      z. B. "#FFFFFF #CFE8FF #FFF1D0"), aus denen jeder Funken zufällig eine
      Farbe zieht. Leer = die Farbe der jeweiligen Bridge.
  gc_direction:
    name: chase – Richtung (Standard)
    description: >-
      Nur effect chase (Gradient Lightstrips). Standard-Chaserichtung für Bridges ohne
      eigene Einstellung: forward (vorwärts, umlaufend), backward (rückwärts,
      umlaufend) oder bounce (prallt an beiden Enden ab wie ein
      Larson-Scanner, statt umzulaufen).
  gc_count:
    name: chase – Anzahl Chases (Standard)
    description: >-
      Nur effect chase (Gradient Lightstrips). Wie viele Chase-Bänder gleichzeitig über den
      Strip laufen, gleichmäßig verteilt (Standard 1).
  gc_length:
    name: chase – Chase-Länge (Standard)
    description: >-
      Nur effect chase (Gradient Lightstrips). Breite des vollfarbigen Kerns eines
      Chase-Bands in Segmenten (Standard 2.0), mit weichem Übergang zur
      Background-Farbe an den Rändern.
  gc_speed:
    name: chase – Geschwindigkeit (Standard)
    description: >-
      Nur effect chase (Gradient Lightstrips). Wie viele Segmente ein Chase-Kopf pro
      Sekunde zurücklegt (Standard 4.0).
  gc_background_color:
    name: chase – Background-Farbe (Standard)
    description: >-
      Nur effect chase (Gradient Lightstrips). Standard-Hex-Farbe des Bereichs außerhalb der
      Chase-Bänder (Vorgabe #000000, aus). Die Chase-Farbe kommt aus der
      Option/dem Feld color.
  gc_chase_glitter:
    name: chase – Chases funkeln (Standard)
    description: >-
      Nur effect chase (Gradient Lightstrips). Lässt die Chase-Bänder zusätzlich wie
      effect glitter funkeln (nutzt glitter_interval_ms/glitter_flash_ms/
      glitter_colors), Funken nur innerhalb der Bänder.
  gc_background_pulse:
    name: chase – Background pulsiert (Standard)
    description: >-
      Nur effect chase (Gradient Lightstrips). Lässt den Background zusätzlich wie
      effect pulse zwischen glow_low und glow_high pulsieren (nutzt
      attack_ms/release_ms/sweep_seconds), statt ruhig auf glow_low zu
      bleiben. Die Chase-Bänder bleiben davon unberührt auf glow_high.
  color2:
    name: zweite Farbe (Standard)
    description: >-
      Standard-Hex-Farbe für effect police (zweite Lampengruppe) und effect
      duel (zweiter Komet); die erste Farbe kommt jeweils aus der Option/dem
      Feld color. Vorgabe #0000FF (Blau), zusammen mit dem roten Standard
      also klassisches Blaulicht.
  lightning_interval_ms:
    name: lightning – Blitz-Intervall ms (Standard)
    description: >-
      Nur effect lightning. Mittlerer Abstand in Millisekunden zwischen zwei
      Blitzen, die alle Lampen einer Bridge gemeinsam aufleuchten lassen
      (Standard 4000 = alle ~4 s ein Blitz, gelegentlich mit Doppelschlag).
  lightning_flash_ms:
    name: lightning – Blitzdauer ms (Standard)
    description: >-
      Nur effect lightning. Abkling-Zeitkonstante eines Blitzes in
      Millisekunden – wie schnell er nach dem Aufleuchten wieder verblasst
      (Standard 500).
  meteor_count:
    name: meteor – Anzahl (Standard)
    description: >-
      Nur effect meteor. Wie viele unabhängige Meteore gleichzeitig über die
      Kanäle laufen, jeder mit eigener zufälliger Geschwindigkeit, Richtung
      und Helligkeit (Standard 3).
  meteor_speed:
    name: meteor – Geschwindigkeit (Standard)
    description: >-
      Nur effect meteor. Mittlere Geschwindigkeit der Meteore in Kanälen pro
      Sekunde – jeder Meteor weicht zufällig davon ab (Standard 1.2).
  firework_interval_ms:
    name: firework – Intervall ms (Standard)
    description: >-
      Nur effect firework. Wie oft (in Millisekunden) ein neuer
      Feuerwerk-Ausbruch von der Mitte der Kanäle losläuft (Standard 3000).
  firework_speed:
    name: firework – Geschwindigkeit (Standard)
    description: >-
      Nur effect firework. Wie schnell sich der Ausbruch von der Mitte nach
      außen ausbreitet, in Kanälen pro Sekunde (Standard 6.0).
  ripple_interval_ms:
    name: ripple – Intervall ms (Standard)
    description: >-
      Nur effect ripple. Wie oft (in Millisekunden) ein neuer
      Helligkeitsimpuls von der Mitte der Kanäle losläuft (Standard 3000).
  ripple_speed:
    name: ripple – Geschwindigkeit (Standard)
    description: >-
      Nur effect ripple. Wie schnell sich die Wellenfront von der Mitte weg
      (und beim Echo wieder zurück) bewegt, in Kanälen pro Sekunde (Standard
      6.0).
  wave_length:
    name: wave – Wellenlänge (Standard)
    description: >-
      Nur effect wave. Anzahl Kanäle pro voller Sinuswelle – klein = mehrere
      kurze Wellenberge gleichzeitig sichtbar, groß = eine lange, sanfte
      Welle (Standard 3.0).
  flicker_interval_ms:
    name: flicker – Intervall ms (Standard)
    description: >-
      Nur effect flicker. Mittlerer Abstand in Millisekunden zwischen zwei
      Einbrüchen über alle Lampen einer Bridge (Standard 600).
  flicker_dip_ms:
    name: flicker – Einbruchsdauer ms (Standard)
    description: >-
      Nur effect flicker. Wie schnell eine Lampe nach einem Einbruch wieder
      auf normale Helligkeit zurückfindet, in Millisekunden (Standard 150).
  restore_state:
    name: Lichtzustand wiederherstellen
    description: >-
      Vor dem Effekt den aktuellen Zustand der Lampen (an/aus, Helligkeit, Farbe)
      sichern und danach wiederherstellen.
  duration:
    name: Effektdauer (Sekunden)
    description: >-
      Wie lange der Effekt standardmäßig läuft, bevor er von selbst endet
      (gilt für alle Bridges gemeinsam; im /start-Aufruf pro Aufruf
      übersteuerbar). 0 = unbegrenzt, läuft bis zum manuellen Stop.
  log_level:
    name: Log-Level
    description: Ausführlichkeit des App-Protokolls (trace, debug, info, notice, warning, error, fatal).
network:
  8099/tcp: REST-API und Web-UI (nur nötig für Zugriff außerhalb von Ingress, z. B. rest_command)
