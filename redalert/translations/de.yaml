configuration:
  bridges:
    name: Hue Bridges
    description: >-
      Bis zu 3 Hue Bridges, die den Effekt gleichzeitig abspielen. Pro Bridge
      Zeile hinzufügen und ausfüllen.
    bridge_host:
      name: Hue-Bridge-IP
      description: >-
        IP-Adresse der Hue Bridge. Kann auch pro /pair-Aufruf übergeben werden.
    area_id:
      name: Entertainment-Bereich-ID
      description: >-
        ID des Hue-Entertainment-Bereichs dieser Bridge, an den gestreamt wird.
        Über den Button „Bereiche laden“ im Web-UI oder GET /areas ermitteln.
    channel_order:
      name: Kanalreihenfolge
      description: >-
        Optionale Reihenfolge der channel_ids dieser Bridge für den
        Kometen-Sweep, als kommagetrennte Liste, z. B. 2,3,1,0,5,4. Leer
        lassen = native Reihenfolge des Bereichs.
  effect:
    name: Effekt
    description: >-
      pulse = alle Lampen zusammen: von 0 auf 100 % im Takt der Musik, zwischen
      den Pulsen wieder auf 0 (Abfallen schneller als Aufblenden).
      chase = ein Komet läuft gleichmäßig umlaufend über die Kanäle und zieht
      einen Schweif hinter sich her.
  color:
    name: Farbe
    description: Hex-Farbe des Lauflichts (Standard #FF0000, Star-Trek-Rot).
  fps:
    name: Frames pro Sekunde
    description: Taktrate des DTLS-Streams. Höher = flüssiger, mehr Netzlast (5–50).
  sweep_seconds:
    name: Sweep-Dauer
    description: >-
      chase: Sekunden für eine volle Umrundung aller Lampen.
      pulse: Dauer eines vollständigen Auf-/Ab-Zyklus (0.3–5.0).
  chase_pause:
    name: chase-Pause (Sekunden)
    description: >-
      Pause zwischen zwei chase-Durchläufen. 0 = durchgehend umlaufender Komet
      (Standard). > 0 = ein kompletter Durchlauf, dann alle Lampen für so viele
      Sekunden auf dem Grund-Glühwert, dann der nächste Durchlauf.
  attack_ms:
    name: Attack (ms)
    description: >-
      pulse – wie langsam das Licht von glow_low auf glow_high aufblendet.
  release_ms:
    name: Release (ms)
    description: >-
      pulse – wie schnell das Licht zwischen den Pulsen auf glow_low abfällt.
      Für den typischen Look kleiner als Attack wählen (schnelleres Abfallen).
  glow_low:
    name: Grund-Glühwert
    description: >-
      Helligkeit (0–1), auf die die Lampen zwischen den Pulsen zurückgehen –
      bei beiden Effekten. 0 = ganz aus, z. B. 0.08 = schwaches Dauerglühen.
  glow_high:
    name: Spitzen-Wert
    description: >-
      Helligkeit (0–1) im Puls-Maximum (beide Effekte). Standard 1.0 = volle
      Helligkeit. Muss über dem Grund-Glühwert liegen.
  restore_state:
    name: Lichtzustand wiederherstellen
    description: >-
      Vor dem Effekt den aktuellen Zustand der Lampen (an/aus, Helligkeit, Farbe)
      sichern und danach wiederherstellen.
  log_level:
    name: Log-Level
    description: Ausführlichkeit des Add-on-Protokolls (trace, debug, info, notice, warning, error, fatal).
network:
  8099/tcp: REST-API und Web-UI (nur nötig für Zugriff außerhalb von Ingress, z. B. rest_command)
