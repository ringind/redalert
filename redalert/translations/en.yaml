configuration:
  bridges:
    name: Hue Bridges
    description: >-
      Up to 3 Hue Bridges that play simultaneously. Add one row per bridge;
      effect/color/sweep_seconds/chase_pause/attack_ms/release_ms/glow_low/
      glow_high/glitter_interval_ms/glitter_flash_ms/glitter_colors/
      gc_direction/gc_strip_lengths/gc_count/gc_length/gc_speed/
      gc_background_color/gc_chase_glitter/gc_background_pulse/
      color2/lightning_interval_ms/lightning_flash_ms/meteor_count/
      meteor_speed/firework_interval_ms/firework_speed/ripple_interval_ms/
      ripple_speed/wave_length/flicker_interval_ms/flicker_dip_ms are
      optional per bridge – leave empty and the like-named option below is
      used as this bridge's default.
    bridge_host:
      name: Hue Bridge IP
      description: >-
        IP address of the Hue Bridge. Can also be supplied per /pair call.
    area_id:
      name: Entertainment area ID
      description: >-
        ID of this bridge's Hue Entertainment area to stream to. Read it from
        the "Bereiche laden" button in the web UI or GET /areas.
    channel_order:
      name: Channel order
      description: >-
        Optional order of this bridge's channel IDs for the comet sweep, as a
        comma-separated list, e.g. 2,3,1,0,5,4. Leave empty to use the area's
        native channel order.
    effect:
      name: Effect (this bridge)
      description: >-
        Overrides the effect option for this one bridge. Empty = use the
        default below. neutral = this bridge is left untouched (no stream, no
        save/restore) – handy for leaving a bridge out of an effect set.
    color:
      name: Colour (this bridge)
      description: >-
        Overrides the color option for this one bridge. Empty = use the
        default below.
    sweep_seconds:
      name: Sweep duration (this bridge)
      description: >-
        Overrides the sweep_seconds option for this one bridge. Empty = use
        the default below.
    chase_pause:
      name: chase pause (this bridge)
      description: >-
        Overrides the chase_pause option for this one bridge. Empty = use the
        default below.
    attack_ms:
      name: Attack ms (this bridge)
      description: >-
        Overrides the attack_ms option for this one bridge. Empty = use the
        default below.
    release_ms:
      name: Release ms (this bridge)
      description: >-
        Overrides the release_ms option for this one bridge. Empty = use the
        default below.
    glow_low:
      name: Resting glow level (this bridge)
      description: >-
        Overrides the glow_low option for this one bridge. Empty = use the
        default below.
    glow_high:
      name: Peak level (this bridge)
      description: >-
        Overrides the glow_high option for this one bridge. Empty = use the
        default below.
    glitter_interval_ms:
      name: Glitter interval ms (this bridge)
      description: >-
        Overrides the glitter_interval_ms option for this one bridge. Empty =
        use the default below.
    glitter_flash_ms:
      name: Glitter flash ms (this bridge)
      description: >-
        Overrides the glitter_flash_ms option for this one bridge. Empty = use
        the default below.
    glitter_colors:
      name: Glitter colours (this bridge)
      description: >-
        Overrides the glitter_colors option for this one bridge (hex colours
        separated by spaces). Empty = use the default below.
    gc_direction:
      name: chase/color_chase direction(s) (this bridge)
      description: >-
        Overrides the gc_direction option for this one bridge. A single value
        (forward/backward/bounce) applies to every strip on this bridge; once
        split into several strips with gc_strip_lengths, this can also be a
        comma-separated list (one direction per strip, e.g.
        "forward,backward"). Empty = use the default below.
    gc_strip_lengths:
      name: chase strip lengths (this bridge)
      description: >-
        effect chase only (Gradient Lightstrips). Splits this bridge's channels (after
        channel_order) into consecutive Gradient Lightstrips, as a
        comma-separated list of segment counts, e.g. "7,5" for two combined
        strips of 7 and 5 segments. Must sum to the channel count, otherwise
        a single strip spanning all channels is used. Empty = one strip.
    gc_count:
      name: chase count (this bridge)
      description: >-
        Overrides the gc_count option for this one bridge. Empty = use the
        default below.
    gc_length:
      name: chase length (this bridge)
      description: >-
        Overrides the gc_length option for this one bridge. Empty = use the
        default below.
    gc_speed:
      name: chase/color_chase speed (this bridge)
      description: >-
        Overrides the gc_speed option for this one bridge (for color_chase:
        lamps/steps per second). Empty = use the default below.
    gc_background_color:
      name: chase background colour (this bridge)
      description: >-
        Overrides the gc_background_color option for this one bridge. Empty =
        use the default below.
    gc_chase_glitter:
      name: chase bands sparkle (this bridge)
      description: >-
        Overrides the gc_chase_glitter option for this one bridge. Empty =
        use the default below.
    gc_background_pulse:
      name: chase background pulses (this bridge)
      description: >-
        Overrides the gc_background_pulse option for this one bridge. Empty =
        use the default below.
    color2:
      name: second colour (this bridge)
      description: >-
        Overrides the color2 option for this one bridge – second colour for
        police (group 2) and duel (second comet). Empty = use the default
        below.
    lightning_interval_ms:
      name: lightning strike interval ms (this bridge)
      description: >-
        Overrides the lightning_interval_ms option for this one bridge.
        Empty = use the default below.
    lightning_flash_ms:
      name: lightning flash time ms (this bridge)
      description: >-
        Overrides the lightning_flash_ms option for this one bridge. Empty =
        use the default below.
    meteor_count:
      name: meteor count (this bridge)
      description: >-
        Overrides the meteor_count option for this one bridge. Empty = use
        the default below.
    meteor_speed:
      name: meteor speed (this bridge)
      description: >-
        Overrides the meteor_speed option for this one bridge. Empty = use
        the default below.
    firework_interval_ms:
      name: firework interval ms (this bridge)
      description: >-
        Overrides the firework_interval_ms option for this one bridge. Empty
        = use the default below.
    firework_speed:
      name: firework speed (this bridge)
      description: >-
        Overrides the firework_speed option for this one bridge. Empty = use
        the default below.
    ripple_interval_ms:
      name: ripple interval ms (this bridge)
      description: >-
        Overrides the ripple_interval_ms option for this one bridge. Empty =
        use the default below.
    ripple_speed:
      name: ripple speed (this bridge)
      description: >-
        Overrides the ripple_speed option for this one bridge. Empty = use
        the default below.
    wave_length:
      name: wave length (this bridge)
      description: >-
        Overrides the wave_length option for this one bridge. Empty = use
        the default below.
    flicker_interval_ms:
      name: flicker interval ms (this bridge)
      description: >-
        Overrides the flicker_interval_ms option for this one bridge. Empty
        = use the default below.
    flicker_dip_ms:
      name: flicker dip time ms (this bridge)
      description: >-
        Overrides the flicker_dip_ms option for this one bridge. Empty = use
        the default below.
  effect:
    name: Effect (default)
    description: >-
      Default effect for bridges without their own setting. pulse = all lamps
      together: 0 to 100 % on the beat, back to 0 between pulses (fall faster
      than rise). comet = a comet runs evenly around the channels, dragging a
      tail behind it. glitter = each lamp sparkles on its own in very short
      bursts of changing colour (diamond twinkle). police = two lamp groups
      alternately flash two colours (emergency lights). lightning = every
      lamp flashes together at random moments, occasionally a quick
      double-strike (storm). heartbeat = a two-beat "lub-dub" pulse like a
      resting heart rate. aurora = slow, soft colour waves drift across the
      lamps (northern lights). rainbow = a continuous, phase-offset rainbow
      hue-cycle sweeps across the lamps. meteor = several independent
      meteors at randomised speed and brightness. wipe = a fill bar runs
      once across the channels, holds briefly, then starts over. firework =
      recurring bursts radiating outward from the centre. ripple = a
      brightness pulse radiates from the centre, reflects off both ends and
      echoes back inward before fading and starting over. wave = a
      continuous scrolling sine wave of brightness across the channels,
      several crests visible at once. flicker = lamps sporadically dip
      briefly, like a failing bulb. strobe = a hard, instant flash with no
      fade, party-strobe style. duel = two comets launch from opposite ends,
      meet in the middle and bounce back. chase = Gradient Lightstrips only:
      one or more soft-edged two-colour bands
      slide along the segments, see the gc_* options. color_chase = a
      gradient fills itself lamp by lamp (each lamp fades to its target
      colour as the head passes), three palettes in turn – red→yellow,
      green→cyan, blue→magenta; speed via gc_speed (then lamps per second),
      direction via gc_direction. neutral = the lamps are not driven at all
      (e.g. for an effect set where only some bridges run).
  color:
    name: Colour (default)
    description: >-
      Default hex colour for bridges without their own setting (default
      #FF0000, Star Trek red).
  fps:
    name: Frames per second
    description: >-
      DTLS stream rate (same for every bridge). Higher = smoother, more
      network traffic (5–50).
  sweep_seconds:
    name: Sweep duration (default)
    description: >-
      Default for bridges without their own setting. comet: seconds for one
      full loop of the comet around all lamps. pulse/heartbeat: length of one
      cycle. wave/strobe/duel: period length. Range 0.3–300 – for very slow,
      calm effects pick something much higher than for the fast effects.
  chase_pause:
    name: chase pause in seconds (default)
    description: >-
      Default for bridges without their own setting. Pause between two comet
      runs. 0 = one continuous looping comet (default). > 0 = one full run,
      then all lamps rest at the low glow for that many seconds, then the
      next run.
  attack_ms:
    name: Attack ms (default)
    description: >-
      Default for bridges without their own setting. pulse – how slowly the
      light ramps from glow_low to glow_high.
  release_ms:
    name: Release ms (default)
    description: >-
      Default for bridges without their own setting. pulse – how fast the
      light drops back to glow_low between pulses. Keep it smaller than
      attack for the intended look (faster fall than rise).
  glow_low:
    name: Resting glow level (default)
    description: >-
      Default for bridges without their own setting. Brightness (0–1) the
      lamps return to between pulses – for both effects. 0 = fully off,
      e.g. 0.08 = a faint constant glow.
  glow_high:
    name: Peak level (default)
    description: >-
      Default for bridges without their own setting. Brightness (0–1) at the
      pulse peak (both effects). Default 1.0 = full brightness. Must be above
      the resting glow level.
  glitter_interval_ms:
    name: Glitter interval (ms, default)
    description: >-
      effect glitter only. Mean gap in milliseconds between two sparkle
      flashes across all of a bridge's lamps. Small = frantic diamond twinkle
      (default 90).
  glitter_flash_ms:
    name: Glitter flash time (ms, default)
    description: >-
      effect glitter only. How fast a single spark fades out (time constant in
      milliseconds). Larger than the interval = several lamps sparkle at once
      (default 260).
  glitter_colors:
    name: Glitter colours (default)
    description: >-
      effect glitter only. List of hex colours (space-separated, e.g.
      "#FFFFFF #CFE8FF #FFF1D0") each spark picks from at random. Empty = the
      colour of the respective bridge.
  gc_direction:
    name: chase/color_chase direction (default)
    description: >-
      For effect chase and color_chase. Default direction for bridges without
      their own setting: forward (looping), backward (looping) or bounce
      (reflects off both ends like a Larson scanner instead of looping; for
      color_chase the fill direction flips with every palette).
  gc_count:
    name: chase count (default)
    description: >-
      effect chase only (Gradient Lightstrips). How many chase bands run at once, evenly
      spaced along the strip (default 1).
  gc_length:
    name: chase length (default)
    description: >-
      effect chase only (Gradient Lightstrips). Width of a chase band's solid-colour core
      in segments (default 2.0), with a soft edge fading to the background
      colour.
  gc_speed:
    name: chase/color_chase speed (default)
    description: >-
      For effect chase (segments per second a chase head crosses) and
      color_chase (lamps/steps per second – one lamp every 1/value seconds,
      the switch itself is instant). Default 4.0.
  gc_background_color:
    name: chase background colour (default)
    description: >-
      effect chase only (Gradient Lightstrips). Default hex colour outside the chase bands
      (default #000000, off). The chase colour comes from the color
      option/field.
  gc_chase_glitter:
    name: chase bands sparkle (default)
    description: >-
      effect chase only (Gradient Lightstrips). Makes the chase bands additionally sparkle
      like effect glitter (uses glitter_interval_ms/glitter_flash_ms/
      glitter_colors), sparks only inside the bands.
  gc_background_pulse:
    name: chase background pulses (default)
    description: >-
      effect chase only (Gradient Lightstrips). Makes the background additionally pulse
      between glow_low and glow_high like effect pulse (uses attack_ms/
      release_ms/sweep_seconds), instead of resting quietly at glow_low. The
      chase bands stay unaffected at glow_high.
  color2:
    name: second colour (default)
    description: >-
      Default hex colour for effect police (second lamp group) and effect
      duel (second comet); the first colour comes from the color
      option/field. Default #0000FF (blue), so together with the red default
      this gives classic red/blue emergency lights.
  lightning_interval_ms:
    name: lightning strike interval ms (default)
    description: >-
      effect lightning only. Mean gap in milliseconds between two strikes
      that light every lamp of a bridge together (default 4000 = roughly one
      strike every 4 s, occasionally with a quick double-strike).
  lightning_flash_ms:
    name: lightning flash time ms (default)
    description: >-
      effect lightning only. Decay time constant of a strike in
      milliseconds – how fast it fades after flashing (default 500).
  meteor_count:
    name: meteor count (default)
    description: >-
      effect meteor only. How many independent meteors cross the channels at
      once, each with its own randomised speed, direction and brightness
      (default 3).
  meteor_speed:
    name: meteor speed (default)
    description: >-
      effect meteor only. Average meteor speed in channels per second – each
      meteor varies randomly around it (default 1.2).
  firework_interval_ms:
    name: firework interval ms (default)
    description: >-
      effect firework only. How often (in milliseconds) a new burst starts
      from the centre of the channels (default 3000).
  firework_speed:
    name: firework speed (default)
    description: >-
      effect firework only. How fast the burst expands outward from the
      centre, in channels per second (default 6.0).
  ripple_interval_ms:
    name: ripple interval ms (default)
    description: >-
      effect ripple only. How often (in milliseconds) a new brightness pulse
      starts from the centre of the channels (default 3000).
  ripple_speed:
    name: ripple speed (default)
    description: >-
      effect ripple only. How fast the wavefront moves away from the centre
      (and back on the echo), in channels per second (default 6.0).
  wave_length:
    name: wave length (default)
    description: >-
      effect wave only. Number of channels per full sine cycle – small =
      several short crests visible at once, large = one long, gentle wave
      (default 3.0).
  flicker_interval_ms:
    name: flicker interval ms (default)
    description: >-
      effect flicker only. Mean gap in milliseconds between two dips across
      all of a bridge's lamps (default 600).
  flicker_dip_ms:
    name: flicker dip time ms (default)
    description: >-
      effect flicker only. How fast a lamp recovers to normal brightness
      after a dip, in milliseconds (default 150).
  restore_state:
    name: Restore light state
    description: >-
      Snapshot the lamps' current state (on/off, brightness, colour) before the
      effect and put it back afterwards.
  duration:
    name: Effect duration (seconds)
    description: >-
      How long the effect runs by default before ending on its own (applies
      to all bridges together; overridable per /start call). 0 = unlimited,
      runs until manually stopped.
  log_level:
    name: Log level
    description: Verbosity of the app log (trace, debug, info, notice, warning, error, fatal).
network:
  8099/tcp: REST API and web UI (only needed for access outside Ingress, e.g. rest_command)
