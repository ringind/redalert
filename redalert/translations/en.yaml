configuration:
  bridge_host:
    name: Hue Bridge IP
    description: >-
      IP address of the Hue Bridge. Optional – can also be supplied per /pair call.
  area_id:
    name: Entertainment area ID
    description: >-
      ID of the Hue Entertainment area to stream to. Read it from the "Bereiche laden"
      button in the web UI or GET /areas.
  channel_order:
    name: Channel order
    description: >-
      Optional explicit list of channel IDs defining the order the comet sweeps
      along. Leave empty to use the area's native channel order.
  effect:
    name: Effect
    description: >-
      pulse = all lamps together: 0 to 100 % on the beat, back to 0 between
      pulses (fall faster than rise).
      chase = a comet runs evenly around the channels, dragging a tail behind it.
  color:
    name: Colour
    description: Hex colour of the effect (default #FF0000, Star Trek red).
  fps:
    name: Frames per second
    description: DTLS stream rate. Higher = smoother, more network traffic (5–50).
  sweep_seconds:
    name: Sweep duration
    description: >-
      chase: seconds for one full loop of the comet around all lamps.
      pulse without a cue: length of one full up/down cycle (0.3–5.0).
  attack_ms:
    name: Attack (ms)
    description: pulse – how slowly the light ramps from 0 to 100 %.
  release_ms:
    name: Release (ms)
    description: >-
      pulse – how fast the light drops back to 0 between pulses. Keep it smaller
      than attack for the intended look (faster fall than rise).
  restore_state:
    name: Restore light state
    description: >-
      Snapshot the lamps' current state (on/off, brightness, colour) before the
      effect and put it back afterwards.
  cue_file:
    name: Cue file path
    description: >-
      Path to an alternative redalert_cue.json (e.g. /share/redalert_cue.json).
      Empty = use the bundled cue.
  log_level:
    name: Log level
    description: Verbosity of the add-on log (trace, debug, info, notice, warning, error, fatal).
network:
  8099/tcp: REST API and web UI (only needed for access outside Ingress, e.g. rest_command)
