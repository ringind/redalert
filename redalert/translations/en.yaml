configuration:
  bridges:
    name: Hue Bridges
    description: >-
      Up to 3 Hue Bridges that play simultaneously. Add one row per bridge;
      effect/color/sweep_seconds/chase_pause/attack_ms/release_ms/glow_low/
      glow_high/glitter_interval_ms/glitter_flash_ms/glitter_colors/
      gc_direction/gc_strip_lengths/gc_count/gc_length/gc_speed/
      gc_background_color/gc_chase_glitter/gc_background_pulse are optional
      per bridge – leave empty and the like-named option below is used as
      this bridge's default.
    bridge_host:
      name: Hue Bridge IP
      description: >-
        IP address of the Hue Bridge. Can also be supplied per /pair call.
    area_id:
      name: Entertainment area ID
      description: >-
        ID of this bridge's Hue Entertainment area to stream to. Read it from
        the "Bereiche laden" button in the web UI or GET /areas.
    channel_order:
      name: Channel order
      description: >-
        Optional order of this bridge's channel IDs for the comet sweep, as a
        comma-separated list, e.g. 2,3,1,0,5,4. Leave empty to use the area's
        native channel order.
    effect:
      name: Effect (this bridge)
      description: >-
        Overrides the effect option for this one bridge. Empty = use the
        default below. neutral = this bridge is left untouched (no stream, no
        save/restore) – handy for leaving a bridge out of an effect set.
    color:
      name: Colour (this bridge)
      description: >-
        Overrides the color option for this one bridge. Empty = use the
        default below.
    sweep_seconds:
      name: Sweep duration (this bridge)
      description: >-
        Overrides the sweep_seconds option for this one bridge. Empty = use
        the default below.
    chase_pause:
      name: chase pause (this bridge)
      description: >-
        Overrides the chase_pause option for this one bridge. Empty = use the
        default below.
    attack_ms:
      name: Attack ms (this bridge)
      description: >-
        Overrides the attack_ms option for this one bridge. Empty = use the
        default below.
    release_ms:
      name: Release ms (this bridge)
      description: >-
        Overrides the release_ms option for this one bridge. Empty = use the
        default below.
    glow_low:
      name: Resting glow level (this bridge)
      description: >-
        Overrides the glow_low option for this one bridge. Empty = use the
        default below.
    glow_high:
      name: Peak level (this bridge)
      description: >-
        Overrides the glow_high option for this one bridge. Empty = use the
        default below.
    glitter_interval_ms:
      name: Glitter interval ms (this bridge)
      description: >-
        Overrides the glitter_interval_ms option for this one bridge. Empty =
        use the default below.
    glitter_flash_ms:
      name: Glitter flash ms (this bridge)
      description: >-
        Overrides the glitter_flash_ms option for this one bridge. Empty = use
        the default below.
    glitter_colors:
      name: Glitter colours (this bridge)
      description: >-
        Overrides the glitter_colors option for this one bridge (hex colours
        separated by spaces). Empty = use the default below.
    gc_direction:
      name: gradient_chase direction(s) (this bridge)
      description: >-
        Overrides the gc_direction option for this one bridge. A single value
        (forward/backward/bounce) applies to every strip on this bridge; once
        split into several strips with gc_strip_lengths, this can also be a
        comma-separated list (one direction per strip, e.g.
        "forward,backward"). Empty = use the default below.
    gc_strip_lengths:
      name: gradient_chase strip lengths (this bridge)
      description: >-
        effect gradient_chase only. Splits this bridge's channels (after
        channel_order) into consecutive Gradient Lightstrips, as a
        comma-separated list of segment counts, e.g. "7,5" for two combined
        strips of 7 and 5 segments. Must sum to the channel count, otherwise
        a single strip spanning all channels is used. Empty = one strip.
    gc_count:
      name: gradient_chase chase count (this bridge)
      description: >-
        Overrides the gc_count option for this one bridge. Empty = use the
        default below.
    gc_length:
      name: gradient_chase chase length (this bridge)
      description: >-
        Overrides the gc_length option for this one bridge. Empty = use the
        default below.
    gc_speed:
      name: gradient_chase speed (this bridge)
      description: >-
        Overrides the gc_speed option for this one bridge. Empty = use the
        default below.
    gc_background_color:
      name: gradient_chase background colour (this bridge)
      description: >-
        Overrides the gc_background_color option for this one bridge. Empty =
        use the default below.
    gc_chase_glitter:
      name: gradient_chase chases sparkle (this bridge)
      description: >-
        Overrides the gc_chase_glitter option for this one bridge. Empty =
        use the default below.
    gc_background_pulse:
      name: gradient_chase background pulses (this bridge)
      description: >-
        Overrides the gc_background_pulse option for this one bridge. Empty =
        use the default below.
  effect:
    name: Effect (default)
    description: >-
      Default effect for bridges without their own setting. pulse = all lamps
      together: 0 to 100 % on the beat, back to 0 between pulses (fall faster
      than rise). chase = a comet runs evenly around the channels, dragging a
      tail behind it. glitter = each lamp sparkles on its own in very short
      bursts of changing colour (diamond twinkle). gradient_chase = Gradient
      Lightstrips only: one or more soft-edged two-colour bands slide along
      the segments, see the gc_* options. neutral = the lamps are not driven
      at all (e.g. for an effect set where only some bridges run).
  color:
    name: Colour (default)
    description: >-
      Default hex colour for bridges without their own setting (default
      #FF0000, Star Trek red).
  fps:
    name: Frames per second
    description: >-
      DTLS stream rate (same for every bridge). Higher = smoother, more
      network traffic (5–50).
  sweep_seconds:
    name: Sweep duration (default)
    description: >-
      Default for bridges without their own setting. chase: seconds for one
      full loop of the comet around all lamps. pulse: length of one full
      up/down cycle (0.3–5.0).
  chase_pause:
    name: chase pause in seconds (default)
    description: >-
      Default for bridges without their own setting. Pause between two chase
      runs. 0 = one continuous looping comet (default). > 0 = one full run,
      then all lamps rest at the low glow for that many seconds, then the
      next run.
  attack_ms:
    name: Attack ms (default)
    description: >-
      Default for bridges without their own setting. pulse – how slowly the
      light ramps from glow_low to glow_high.
  release_ms:
    name: Release ms (default)
    description: >-
      Default for bridges without their own setting. pulse – how fast the
      light drops back to glow_low between pulses. Keep it smaller than
      attack for the intended look (faster fall than rise).
  glow_low:
    name: Resting glow level (default)
    description: >-
      Default for bridges without their own setting. Brightness (0–1) the
      lamps return to between pulses – for both effects. 0 = fully off,
      e.g. 0.08 = a faint constant glow.
  glow_high:
    name: Peak level (default)
    description: >-
      Default for bridges without their own setting. Brightness (0–1) at the
      pulse peak (both effects). Default 1.0 = full brightness. Must be above
      the resting glow level.
  glitter_interval_ms:
    name: Glitter interval (ms, default)
    description: >-
      effect glitter only. Mean gap in milliseconds between two sparkle
      flashes across all of a bridge's lamps. Small = frantic diamond twinkle
      (default 90).
  glitter_flash_ms:
    name: Glitter flash time (ms, default)
    description: >-
      effect glitter only. How fast a single spark fades out (time constant in
      milliseconds). Larger than the interval = several lamps sparkle at once
      (default 260).
  glitter_colors:
    name: Glitter colours (default)
    description: >-
      effect glitter only. List of hex colours (space-separated, e.g.
      "#FFFFFF #CFE8FF #FFF1D0") each spark picks from at random. Empty = the
      colour of the respective bridge.
  gc_direction:
    name: gradient_chase direction (default)
    description: >-
      effect gradient_chase only. Default chase direction for bridges without
      their own setting: forward (looping), backward (looping) or bounce
      (reflects off both ends like a Larson scanner instead of looping).
  gc_count:
    name: gradient_chase chase count (default)
    description: >-
      effect gradient_chase only. How many chase bands run at once, evenly
      spaced along the strip (default 1).
  gc_length:
    name: gradient_chase chase length (default)
    description: >-
      effect gradient_chase only. Width of a chase band's solid-colour core
      in segments (default 2.0), with a soft edge fading to the background
      colour.
  gc_speed:
    name: gradient_chase speed (default)
    description: >-
      effect gradient_chase only. How many segments a chase head crosses per
      second (default 4.0).
  gc_background_color:
    name: gradient_chase background colour (default)
    description: >-
      effect gradient_chase only. Default hex colour outside the chase bands
      (default #000000, off). The chase colour comes from the color
      option/field.
  gc_chase_glitter:
    name: gradient_chase chases sparkle (default)
    description: >-
      effect gradient_chase only. Makes the chase bands additionally sparkle
      like effect glitter (uses glitter_interval_ms/glitter_flash_ms/
      glitter_colors), sparks only inside the bands.
  gc_background_pulse:
    name: gradient_chase background pulses (default)
    description: >-
      effect gradient_chase only. Makes the background additionally pulse
      between glow_low and glow_high like effect pulse (uses attack_ms/
      release_ms/sweep_seconds), instead of resting quietly at glow_low. The
      chase bands stay unaffected at glow_high.
  restore_state:
    name: Restore light state
    description: >-
      Snapshot the lamps' current state (on/off, brightness, colour) before the
      effect and put it back afterwards.
  duration:
    name: Effect duration (seconds)
    description: >-
      How long the effect runs by default before ending on its own (applies
      to all bridges together; overridable per /start call). 0 = unlimited,
      runs until manually stopped.
  log_level:
    name: Log level
    description: Verbosity of the app log (trace, debug, info, notice, warning, error, fatal).
network:
  8099/tcp: REST API and web UI (only needed for access outside Ingress, e.g. rest_command)
