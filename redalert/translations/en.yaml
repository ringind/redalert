configuration:
  bridges:
    name: Hue Bridges
    description: >-
      Up to 3 Hue Bridges that play the effect simultaneously. Add one row
      per bridge and fill it in.
    bridge_host:
      name: Hue Bridge IP
      description: >-
        IP address of the Hue Bridge. Can also be supplied per /pair call.
    area_id:
      name: Entertainment area ID
      description: >-
        ID of this bridge's Hue Entertainment area to stream to. Read it from
        the "Bereiche laden" button in the web UI or GET /areas.
    channel_order:
      name: Channel order
      description: >-
        Optional order of this bridge's channel IDs for the comet sweep, as a
        comma-separated list, e.g. 2,3,1,0,5,4. Leave empty to use the area's
        native channel order.
  effect:
    name: Effect
    description: >-
      pulse = all lamps together: 0 to 100 % on the beat, back to 0 between
      pulses (fall faster than rise).
      chase = a comet runs evenly around the channels, dragging a tail behind it.
  color:
    name: Colour
    description: Hex colour of the effect (default #FF0000, Star Trek red).
  fps:
    name: Frames per second
    description: DTLS stream rate. Higher = smoother, more network traffic (5–50).
  sweep_seconds:
    name: Sweep duration
    description: >-
      chase: seconds for one full loop of the comet around all lamps.
      pulse: length of one full up/down cycle (0.3–5.0).
  chase_pause:
    name: chase pause (seconds)
    description: >-
      Pause between two chase runs. 0 = one continuous looping comet (default).
      > 0 = one full run, then all lamps rest at the low glow for that many
      seconds, then the next run.
  attack_ms:
    name: Attack (ms)
    description: pulse – how slowly the light ramps from glow_low to glow_high.
  release_ms:
    name: Release (ms)
    description: >-
      pulse – how fast the light drops back to glow_low between pulses. Keep it
      smaller than attack for the intended look (faster fall than rise).
  glow_low:
    name: Resting glow level
    description: >-
      Brightness (0–1) the lamps return to between pulses – for both effects.
      0 = fully off, e.g. 0.08 = a faint constant glow.
  glow_high:
    name: Peak level
    description: >-
      Brightness (0–1) at the pulse peak (both effects). Default 1.0 = full
      brightness. Must be above the resting glow level.
  restore_state:
    name: Restore light state
    description: >-
      Snapshot the lamps' current state (on/off, brightness, colour) before the
      effect and put it back afterwards.
  log_level:
    name: Log level
    description: Verbosity of the add-on log (trace, debug, info, notice, warning, error, fatal).
network:
  8099/tcp: REST API and web UI (only needed for access outside Ingress, e.g. rest_command)
