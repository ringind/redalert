name: "Red Alert Entertainment"
version: "1.16.1"
slug: "redalert"
description: >-
  Konfigurierbare Hue-Entertainment-Lichteffekte über mehrere Bridges
  gleichzeitig (Puls, Komet, Funkeln, Alarmlicht, Gewitter, Herzschlag,
  Polarlicht, Regenbogen, Meteore, Auffüll-Balken, Feuerwerk, Echo, Welle,
  Flackern, Stroboskop, Duell, Lauflicht für Gradient-Lightstrips) –
  ursprünglich für Star Trek »Alarmstufe Rot«.
url: "https://github.com/ringind/redalert/tree/main/redalert"
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: mdi:alarm-light
panel_title: "Red Alert"
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "REST-API & Web-UI – nur nötig für Zugriff außerhalb von Ingress (z. B. rest_command aus HA)"
map:
  - addon_config:rw
  - share:rw
options:
  bridges: []
  effect: pulse
  color: "#FF0000"
  fps: 25
  sweep_seconds: 1.4
  chase_pause: 0.0
  attack_ms: 140
  release_ms: 70
  glow_low: 0.08
  glow_high: 1.0
  glitter_interval_ms: 90.0
  glitter_flash_ms: 260.0
  glitter_colors: "#FFFFFF #CFE8FF #FFF1D0"
  gc_direction: forward
  gc_count: 1
  gc_length: 2.0
  gc_speed: 4.0
  gc_background_color: "#000000"
  gc_chase_glitter: false
  gc_background_pulse: false
  color2: "#0000FF"
  lightning_interval_ms: 4000.0
  lightning_flash_ms: 500.0
  meteor_count: 3
  meteor_speed: 1.2
  firework_interval_ms: 3000.0
  firework_speed: 6.0
  ripple_interval_ms: 3000.0
  ripple_speed: 6.0
  wave_length: 3.0
  flicker_interval_ms: 600.0
  flicker_dip_ms: 150.0
  restore_state: true
  duration: 0.0
  log_level: info
schema:
  bridges:
    - bridge_host: "str"
      area_id: "str"
      channel_order: "str?"
      effect: "list(pulse|comet|glitter|chase|police|lightning|heartbeat|aurora|rainbow|meteor|wipe|firework|ripple|wave|flicker|strobe|duel|neutral)?"
      color: "match(^#[0-9A-Fa-f]{6}$)?"
      sweep_seconds: "float(0.3,300.0)?"
      chase_pause: "float(0,60)?"
      attack_ms: "int(0,2000)?"
      release_ms: "int(0,5000)?"
      glow_low: "float(0,1)?"
      glow_high: "float(0,1)?"
      glitter_interval_ms: "float(5,5000)?"
      glitter_flash_ms: "float(20,5000)?"
      glitter_colors: "str?"
      gc_direction: "str?"
      gc_strip_lengths: "str?"
      gc_count: "int(1,8)?"
      gc_length: "float(0.2,200)?"
      gc_speed: "float(0.01,50)?"
      gc_background_color: "match(^#[0-9A-Fa-f]{6}$)?"
      gc_chase_glitter: "bool?"
      gc_background_pulse: "bool?"
      color2: "match(^#[0-9A-Fa-f]{6}$)?"
      lightning_interval_ms: "float(50,60000)?"
      lightning_flash_ms: "float(20,5000)?"
      meteor_count: "int(1,8)?"
      meteor_speed: "float(0.05,20)?"
      firework_interval_ms: "float(200,60000)?"
      firework_speed: "float(0.5,50)?"
      ripple_interval_ms: "float(200,60000)?"
      ripple_speed: "float(0.5,50)?"
      wave_length: "float(0.5,50)?"
      flicker_interval_ms: "float(20,10000)?"
