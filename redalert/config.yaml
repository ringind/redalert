name: "Red Alert Entertainment"
version: "1.5.0"
slug: "redalert"
description: >-
  Rotes Lauflicht über Philips-Hue-Lampen via Hue Entertainment API
  (Star Trek »Alarmstufe Rot«), auf bis zu 3 Bridges gleichzeitig.
url: "https://github.com/ringind/redalert/tree/main/redalert"
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: mdi:alarm-light
panel_title: "Red Alert"
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "REST-API & Web-UI – nur nötig für Zugriff außerhalb von Ingress (z. B. rest_command aus HA)"
map:
  - addon_config:rw
  - share:rw
options:
  bridges: []
  effect: pulse
  color: "#FF0000"
  fps: 25
  sweep_seconds: 1.4
  chase_pause: 0.0
  attack_ms: 140
  release_ms: 70
  glow_low: 0.08
  glow_high: 1.0
  glitter_interval_ms: 90.0
  glitter_flash_ms: 260.0
  glitter_colors: "#FFFFFF #CFE8FF #FFF1D0"
  restore_state: true
  duration: 0.0
  log_level: info
schema:
  bridges:
    - bridge_host: "str"
      area_id: "str"
      channel_order: "str?"
      effect: "list(pulse|chase|glitter)?"
      color: "match(^#[0-9A-Fa-f]{6}$)?"
      sweep_seconds: "float(0.3,5.0)?"
      chase_pause: "float(0,60)?"
      attack_ms: "int(0,2000)?"
      release_ms: "int(0,5000)?"
      glow_low: "float(0,1)?"
      glow_high: "float(0,1)?"
      glitter_interval_ms: "float(5,5000)?"
      glitter_flash_ms: "float(20,5000)?"
      glitter_colors: "str?"
  effect: "list(pulse|chase|glitter)?"
  color: "match(^#[0-9A-Fa-f]{6}$)?"
  fps: "int(5,50)"
  sweep_seconds: "float(0.3,5.0)"
  chase_pause: "float(0,60)?"
  attack_ms: "int(0,2000)?"
  release_ms: "int(0,5000)?"
  glow_low: "float(0,1)?"
  glow_high: "float(0,1)?"
  glitter_interval_ms: "float(5,5000)?"
  glitter_flash_ms: "float(20,5000)?"
  glitter_colors: "str?"
  restore_state: "bool?"
  duration: "float(0,86400)?"
  log_level: "list(trace|debug|info|notice|warning|error|fatal)?"
