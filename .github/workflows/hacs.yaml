name: HACS

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 3" # wöchentlich, fängt Regressionen durch HACS-/HA-Änderungen ab
  workflow_dispatch:

jobs:
  hacs:
    name: HACS-Validierung
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS-Action
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest-Validierung
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
