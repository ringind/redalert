name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Add-on lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Home Assistant add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: "./redalert"

  build:
    name: Docker build (amd64)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Exercises redalert/Dockerfile against the real HA base image.
      # aarch64 uses the same Dockerfile (see redalert/build.yaml); it is not
      # built here because emulated arm64 wheel/Rust compiles are slow/flaky.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./redalert
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
