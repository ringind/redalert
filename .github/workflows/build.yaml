name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: App lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Home Assistant app linter (frenck/action-addon-linter)
        uses: frenck/action-addon-linter@v2
        with:
          path: "./redalert"

  build:
    name: Docker build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20
          - arch: aarch64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base-python:3.12-alpine3.20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU only matters for the emulated arm64 build.
      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Exercises redalert/Dockerfile against the real HA base image.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./redalert
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ matrix.base }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
